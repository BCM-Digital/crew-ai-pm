AWSTemplateFormatVersion: '2010-09-09'
Description: 'Basic WAF for PM Agent API Gateway'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

Resources:
  PMAgentWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'pm-agent-waf-${Environment}'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      Description: 'Basic WAF rules for PM Agent API Gateway'
      Rules:
        - Name: RateLimitRule
          Priority: 1
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitRule

        - Name: AWSManagedRulesCommonRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesCommonRuleSet

        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesKnownBadInputsRuleSet

      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: PMAgentWebACL

  PMAgentWebACLLogConfig:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt PMAgentWebACL.Arn
      LogDestinationConfigs:
        - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/wafv2/pm-agent'

Outputs:
  WebACLArn:
    Description: WAF Web ACL ARN
    Value: !GetAtt PMAgentWebACL.Arn
    Export:
      Name: !Sub 'PMAgent-WebACL-Arn-${Environment}'

  WebACLId:
    Description: WAF Web ACL ID
    Value: !GetAtt PMAgentWebACL.Id
